name: fetch-okx-data
on:
  workflow_dispatch:
  push:
    branches: [backtest-data]
    paths: ['scripts/fetch_okx.mjs', '.github/workflows/fetch-okx.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/fetch_okx.mjs
      - run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add data
          git commit -m "回測資料更新（OKX 永續 K 線）" || echo "no changes"
          git push
